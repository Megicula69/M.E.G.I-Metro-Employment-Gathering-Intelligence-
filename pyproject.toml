[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-ncr-job-alerts"
version = "0.1.0"
description = "Local Discord NCR job alert demonstration"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9,<4",
  "discord.py>=2.4,<3",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
ncr-job-bot = "job_alert_bot.bot:main"

[tool.setuptools.packages.find]
include = ["job_alert_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
